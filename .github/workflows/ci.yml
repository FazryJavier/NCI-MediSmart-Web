name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install JS dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      # Production deploys public/build straight from git, so the committed build must match the sources.
      - name: Check committed build is up to date
        run: |
          if [ -n "$(git status --porcelain -- public/build)" ]; then
            echo "::error::public/build is out of date. Run 'npm run build' and commit public/build."
            git status --short -- public/build
            exit 1
          fi

      # phpunit.xml points tests at an in-memory SQLite database.
      - name: Run tests
        run: php artisan test
